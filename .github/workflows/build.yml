name: 重建課表網站

# 任何人在 GitHub 網站把新的 Excel 丟進 data/（或更新產生器/版型）後，
# 雲端會自動跑 generate.py 重建網頁並提交，GitHub Pages 隨即重新部署。
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'generate.py'
      - 'templates/**'
  workflow_dispatch:   # 也可在 Actions 頁手動觸發

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install openpyxl

      - name: 產生課表網頁
        run: python generate.py

      - name: 提交重建結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 大字版 手機版 index.html
          if git diff --staged --quiet; then
            echo "沒有變更，略過提交。"
          else
            git commit -m "自動重建課表網頁 [skip ci]"
            git push
          fi
