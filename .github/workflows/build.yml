name: 重建課表網站

# 觸發方式：
#  1. repository_dispatch（type: rebuild）：共用 Google Sheet 一存檔，
#     由 Apps Script 立即呼叫，達成「編輯完即時更新」。
#  2. push：有人把 Excel 丟進 data/（或改 generate.py / 版型）。
#  3. workflow_dispatch：在 Actions 頁手動觸發。
#  4. schedule：每天定時保險重建一次，避免即時觸發萬一漏掉。
on:
  repository_dispatch:
    types: [rebuild]
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'generate.py'
      - 'templates/**'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分鐘輪詢試算表（GitHub 排程可能延遲數分鐘）

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install openpyxl

      - name: 產生課表網頁
        env:
          # 預設來源 = Supabase：n8n 每天從健康處方系統把 course_slots 同步到 Supabase，
          # 這裡每 5 分鐘讀那份重建（公開唯讀 anon key，無需任何 secret）。
          # 要改回別的來源就改 COURSE_SOURCE，或留空讓程式自動判斷：
          #  - COURSE_SOURCE=api + secrets COURSE_API_ACCOUNT/PASSWORD → 直接登入 API 抓
          #  - 設 vars SHEET_XLSX_URL（且未走上面兩條）→ 共用 Google Sheet
          #  - 都沒有 → data/ 內最新的 Excel
          COURSE_SOURCE: supabase
          # 以下為非預設來源時才需要（API 帳密放 Secrets、其餘放 Variables）：
          COURSE_API_ACCOUNT: ${{ secrets.COURSE_API_ACCOUNT }}
          COURSE_API_PASSWORD: ${{ secrets.COURSE_API_PASSWORD }}
          COURSE_START_DATE: ${{ vars.COURSE_START_DATE }}
          COURSE_END_DATE: ${{ vars.COURSE_END_DATE }}
          COURSE_XLSX_URL: ${{ vars.SHEET_XLSX_URL }}
        run: python generate.py

      - name: 提交重建結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "沒有變更，略過提交。"
          else
            git commit -m "自動重建課表網頁 [skip ci]"
            git push
          fi
